<ion-content [fullscreen]="true">

    <ion-row *ngFor="let tarefa of this.projeto">
        <ion-col>Descrição: {{ tarefa.descricao }}</ion-col>
        <ion-col>Local: {{ tarefa.local }}</ion-col>
        <ion-col>Horário de Início: {{ tarefa.hora_inicio }} </ion-col>
        <ion-col>Horário de Termino: {{ tarefa.hora_termino }}</ion-col>
        <ion-col *ngIf="tarefa.status == 'em espera'" style="background-color: orange;">Status: {{ tarefa.status }}</ion-col>
        <ion-col *ngIf="tarefa.status == 'concluido'" style="background-color: green;">Status: {{ tarefa.status }}</ion-col>
        <ion-col *ngIf="tarefa.status == 'em progresso'" style="background-color: blue;">Status: {{ tarefa.status }}</ion-col>
    </ion-row>
    
</ion-content>
