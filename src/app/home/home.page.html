<ion-content [fullscreen]="true">

    <ion-row class="ion-justify-content-center">
        <ion-col size="4">
            <ion-card>
                <ion-card-content>
                    {{ this.veiculo.modelo }}

                    <ion-input [(ngModel)]="this.veiculo.modelo" label="Modelo" labelPlacement="floating"></ion-input>
                    <ion-input [(ngModel)]="this.veiculo.marca" label="Marca" labelPlacement="floating"></ion-input>
                    <ion-input [(ngModel)]="this.veiculo.cor" label="Cor" labelPlacement="floating"></ion-input>
                    <ion-button expand="block" (click)="this.adicionar()">
                        Adicionar
                        <ion-icon name="arrow-forward-circle-outline"></ion-icon>
                    </ion-button>
                </ion-card-content>
            </ion-card>
        </ion-col>
        <ion-col size="4">
            <ng-container *ngFor="let veiculo of this.concessionaria">
                <ion-card>
                    <ion-card-content>
                        {{ veiculo.modelo }} - {{ veiculo.marca }} - {{ veiculo.cor }}
                    </ion-card-content>
                </ion-card>

            </ng-container>
        </ion-col>
    </ion-row>
    
</ion-content>
